name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Check formatting
        run: |
          python -m black --check brightpath tests docs/conf.py scripts/audit_migration_coverage.py
          python -m isort --check-only brightpath tests docs/conf.py scripts/audit_migration_coverage.py

      - name: Lint
        run: python -m ruff check brightpath tests docs/conf.py scripts/audit_migration_coverage.py

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Security scan
        run: python -m bandit -r brightpath

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest --cov=brightpath

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Audit installed-wheel migration coverage
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/audit_migration_coverage.py" \
            --workers 2 \
            --baseline "$GITHUB_WORKSPACE/docs/migration-audit-baseline.json" \
            --output "$RUNNER_TEMP/migration-audit.json"

      - name: Upload migration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-audit
          path: ${{ runner.temp }}/migration-audit.json
          if-no-files-found: warn
