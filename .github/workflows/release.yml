name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*a[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*a[0-9]*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
      anaconda_only:
        description: "Recover Anaconda publication from an existing GitHub/PyPI release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    if: ${{ !inputs.anaconda_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Check formatting
        run: |
          python -m black --check brightpath tests docs/conf.py scripts/audit_migration_coverage.py
          python -m isort --check-only brightpath tests docs/conf.py scripts/audit_migration_coverage.py

      - name: Lint
        run: python -m ruff check brightpath tests docs/conf.py scripts/audit_migration_coverage.py

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Security scan
        run: python -m bandit -r brightpath

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: ${{ !inputs.anaconda_only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest --cov=brightpath

  build:
    name: Build distributions
    if: ${{ !inputs.anaconda_only }}
    runs-on: ubuntu-latest
    needs: [quality, test]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine release version
        id: version
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${RELEASE_EVENT}" == "workflow_dispatch" ]]; then
            VERSION="${REQUESTED_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Validate project version
        shell: bash
        run: |
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          if [[ "${PROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "Tag/release version ${VERSION} does not match pyproject.toml version ${PROJECT_VERSION}."
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "twine>=6.1"

      - name: Build PyPI distributions
        run: python -m build --sdist --wheel --outdir dist .

      - name: Check PyPI distributions
        run: python -m twine check dist/*

      - name: Audit installed-wheel migration coverage
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/audit_migration_coverage.py" \
            --workers 2 \
            --baseline "$GITHUB_WORKSPACE/docs/migration-audit-baseline.json" \
            --output "$RUNNER_TEMP/migration-audit.json"

      - name: Upload migration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-audit
          path: ${{ runner.temp }}/migration-audit.json
          if-no-files-found: warn

      - name: Audit installed-wheel UVEK 2026 routes
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/audit_uvek_2026_routes.py" \
            --workers 2 \
            --baseline "$GITHUB_WORKSPACE/docs/uvek-2026-audit-baseline.json" \
            --output "$RUNNER_TEMP/uvek-2026-audit.json"

      - name: Upload UVEK 2026 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvek-2026-audit
          path: ${{ runner.temp }}/uvek-2026-audit.json
          if-no-files-found: warn

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-anaconda:
    name: Publish to Anaconda
    if: ${{ !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.anaconda_only)) }}
    runs-on: ubuntu-latest
    needs: build
    environment: anaconda
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.anaconda_only && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Verify published release for Anaconda recovery
        if: ${{ inputs.anaconda_only }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_DRAFT="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          test "$IS_DRAFT" = false
          python - <<'PY'
          import json
          import os
          import tomllib
          from urllib.parse import quote
          from urllib.request import urlopen

          version = os.environ["VERSION"]
          with open("pyproject.toml", "rb") as handle:
              assert tomllib.load(handle)["project"]["version"] == version
          with urlopen(f"https://pypi.org/pypi/brightpath/{quote(version, safe='')}/json", timeout=30) as response:
              assert json.load(response)["info"]["version"] == version
          PY

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge,cmutel,konstantinstadler,haasad,pascallesage,romainsacchi
          channel-priority: strict
          auto-update-conda: true

      - name: Build and upload conda package
        shell: bash -l {0}
        env:
          VERSION: ${{ needs.build.outputs.version || inputs.version }}
          ANACONDA_CLIENT_FORCE_STANDALONE: "1"
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_CLOUD }}
          ANACONDA_USER: ${{ vars.ANACONDA_USER || 'romainsacchi' }}
        run: |
          conda install --name base -y anaconda-client conda-build
          conda activate base
          conda build --version
          python -m binstar_client.scripts.cli --version
          mkdir -p "${HOME}/conda-bld"
          conda config --set anaconda_upload no
          export CONDA_BLD_PATH="${HOME}/conda-bld"
          conda build conda/olca-schema/ --python 3.12 --old-build-string --package-format 1
          conda build conda/meta.yaml --channel local --old-build-string --package-format 1
          python -m binstar_client.scripts.cli -t "${ANACONDA_API_TOKEN}" upload \
            -u "${ANACONDA_USER}" \
            "${CONDA_BLD_PATH}"/noarch/olca-schema-*.tar.bz2 \
            --force
          python -m binstar_client.scripts.cli -t "${ANACONDA_API_TOKEN}" upload \
            -u "${ANACONDA_USER}" \
            "${CONDA_BLD_PATH}/noarch/brightpath-${VERSION}-py_0.tar.bz2" \
            --force
